# Change these first
owner: TrucareOS-Dev # Your GitHub organization or username, where this repository lives
repo: backend-upptime # The name of this repository

sites:
  - name: Prod AUTH
    url: $SECRET_SITE_PROD_AUTH
    expectedStatusCodes:
      - 401
  - name: Prod COMMON
    url: $SECRET_SITE_PROD_COMMON
    expectedStatusCodes:
      - 401
  - name: Prod TASK
    url: $SECRET_SITE_PROD_TASK
    expectedStatusCodes:
      - 401
  - name: Prod PMS
    url: $SECRET_SITE_PROD_PMS
    expectedStatusCodes:
      - 401
  - name: Prod Job
    url: $SECRET_SITE_PROD_JOB
    expectedStatusCodes:
      - 404
  - name: Prod RBS
    url: $SECRET_SITE_PROD_RBS
    expectedStatusCodes:
      - 401
  - name: Prod INTAKE
    url: $SECRET_SITE_PROD_INTAKE
    expectedStatusCodes:
      - 401  
  - name: Prod EOB
    url: $SECRET_SITE_PROD_EOB
  - name: Prod INTEGRATION
    url: $SECRET_SITE_PROD_INTEGRATION
    
assignees:
  - devtrucarebilling
   
status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: backend-status.gettrucare.com
  # baseUrl: /your-repo-name
  # logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  logoUrl: https://raw.githubusercontent.com/TrucareOS-Dev/backend-upptime/master/assets/tc-logo.jpeg
  name: Trucare
  introTitle: "**Your dedicated Revenue Cycle team"
  introMessage: Medical billing, credentialing, and A/R management for growing healthcare businesses. Rates as low as 2.49%
  navbar:
    - title: Status
      href: /

runner: "[hosted]"

workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * *"
  updates: "0 3 * * *"
  uptime: "*/5 * * * *"

i18n:
  footer: Trucare Health, LLC

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
